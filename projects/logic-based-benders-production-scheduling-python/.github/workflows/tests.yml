name: tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python run_logic_benders.py --self-test
      - run: python -m unittest discover -s tests -v
      - run: python run_logic_benders.py --seed 42 --jobs 6 --lines 2 --families 3 --instances 3 --bruteforce
